name: Rust launcher

# Throwaway: renders the Controls page references on Windows and commits them to this branch.
on:
  push:
    branches: [switch-attacks-snapshots]
    paths: ['.github/workflows/rust-launcher.yml']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: launcher-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test ui_snapshots controls
        continue-on-error: true
      - run: cargo test --test ui_snapshots controls
      - shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add snapshots/controls-*.png
          git commit -m "Rendered Controls snapshots"
          git push
