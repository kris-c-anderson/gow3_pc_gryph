name: Rust launcher

# Throwaway: renders the Controls page references on Windows and uploads them.
on:
  push:
    branches: [switch-attacks-snapshots]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2025
    defaults:
      run:
        working-directory: launcher-rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --test ui_snapshots controls
        continue-on-error: true
      - run: cargo test --test ui_snapshots controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: controls-snapshots
          path: launcher-rust/snapshots/controls-*.png
